apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: space_user_actions
  rules:
    - actions:
        - READ
      effect: EFFECT_ALLOW
      roles:
        - user
    - actions:
        - WRITE
      effect: EFFECT_ALLOW
      roles:
        - user
      condition:
        match:
          all:
            of:
              - expr: P.attr.actions_to_grant.isSubset(P.attr.grantable_actions)