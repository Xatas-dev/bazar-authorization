apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: space_user
  rules:
    - actions:
        - ADD
      effect: EFFECT_ALLOW
      roles:
        - user
    - actions:
        - DELETE
      effect: EFFECT_ALLOW
      roles:
        - user
      condition:
        match:
          expr: "!has(R.attr.creator) || R.attr.creator == false"
