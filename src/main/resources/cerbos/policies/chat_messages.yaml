apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: chat_messages
  rules:
    - actions:
        - READ
      effect: EFFECT_ALLOW
      roles:
        - user
    - actions:
        - WRITE
      effect: EFFECT_ALLOW
      roles:
        - user

    - actions:
        - DELETE
      effect: EFFECT_ALLOW
      roles:
        - user